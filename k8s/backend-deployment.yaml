---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: argocdproject-backend-deployment
  namespace: chaicafe
  labels:
    app: chaicafe-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: chaicafe-backend
  template:
    metadata:
      labels:
        app: chaicafe-backend
    spec:
      containers:
      - name: chaicafe-backend
        image: rakesh2398/backend:latest
        ports:
        - containerPort: 8080
        env:
        - name: DB_HOST
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: DB_HOST

        - name: DB_PORT
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: DB_PORT

        - name: DB_NAME
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: DB_NAME

        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: postgres-secret
              key: POSTGRES_USER

        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: postgres-secret
              key: POSTGRES_PASSWORD
