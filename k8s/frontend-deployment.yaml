---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: argocdproject-frontend-deployment
  namespace: chaicafe
  labels:
    app: chaicafe-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: chaicafe-frontend
  template:
    metadata:
      labels:
        app: chaicafe-frontend
    spec:
      containers:
      - name: chaicafe-frontend
        image: rakeshkumar2398/frontend:latest
        ports:
        - containerPort: 80
